# Default-profile configuration of the modernized cash ledger and the declared source of truth for every key the module binds.

server:
  port: 8080

  # No server.servlet.context-path, and that omission is load-bearing rather than an oversight. The chart probes
  # /actuator/startup, /actuator/health/readiness and /actuator/health/liveness at the ROOT of port 8080
  # (infra/stocktrader-operator/helm-charts/stocktrader/templates/cash-account.yaml:L204-L222) while publishing the
  # retail base URL to broker as http://<release>-cash-account-service:8080/cash-account
  # (infra/stocktrader-operator/helm-charts/stocktrader/values.yaml:L146). Both can only hold at once when the
  # /cash-account prefix lives on the controllers, so a context path here would break every probe at once.
  #
  # No server.ssl.* either: the template declares container port 8443
  # (.../templates/cash-account.yaml:L199-L201) but the chart provisions no key material for this service, so there
  # is no HTTPS listener to configure and Kubernetes never requires the declared port to be bound.

  # In-flight retail writes each hold a cash_account row lock; draining them beats severing them at SIGTERM.
  shutdown: graceful

  # INTAKE BOUNDS. Nothing in this stack limited a request body: Tomcat's post-size cap covers form encodings only,
  # so a JSON body was bounded by nothing and Jackson materialized whatever arrived BEFORE any field validation ran —
  # heap and CPU in a 2Gi pod (.../templates/cash-account.yaml:L224-L232) for the cost of sending bytes. The largest
  # payload this service defines is a few hundred bytes with every field at its maximum (owner 32, order reference
  # 64), so 8KB is ample headroom and still trivial to refuse. config/RequestBodySizeLimitFilter binds this key,
  # rejects a declared length above it before reading a byte and counts a chunked body as it is read, answering
  # 413 REQUEST_TOO_LARGE in the standard ApiError shape either way.
  max-request-body-size: 8KB
  # The request line and headers, whose 8KB is Tomcat's own default, stated here because it is the bound on the one
  # caller-controlled input the filter above cannot see: the ?amount= query parameter's text.
  max-http-request-header-size: 8KB

  tomcat:
    # Form bodies never reach the filter's counter — the container parses them off the native stream to build the
    # parameter map — so they are bounded here instead. This service consumes application/json only; the value is a
    # cap rather than a facility.
    max-http-form-post-size: 8KB
    # How much of a body the application refused to read Tomcat will still drain to keep the connection usable.
    # Down from the 2MB default: large enough that a rejected request receives its 413 rather than a reset
    # connection, small enough that draining is never the attack. It is also the bound on a body nothing reads at
    # all — one sent to a GET mapping or to an actuator path — which the filter's counter never sees.
    max-swallow-size: 64KB

  # WHAT THESE KEYS DO NOT AND CANNOT BOUND, stated so it is never mistaken for covered. Every value above governs
  # what this process READS; none of them governs what the network DELIVERS, because the connector has already
  # accepted the bytes by the time any of them applies. A body the application parses is capped at 8KB and a body it
  # refuses is drained at no more than 64KB, so no request can cost this pod more than that — but a caller can still
  # spend its own bandwidth pushing bytes at the connector.
  #
  # Closing that outer layer is a DEPLOYMENT change and deliberately not attempted here: it belongs to the ingress,
  # service mesh or API gateway in front of the Service, and this module may not edit
  # infra/stocktrader-operator/helm-charts/** — AAP 0.3.4 makes a chart template change a stop-and-flag condition and
  # AAP 0.2.4 puts values, CRDs and GitOps resources out of scope. The platform owner is the one who can set it, the
  # value to set is a request-body limit at or below this file's 8KB for the /cash-account path space (for example
  # nginx-ingress client_max_body_size, or an Envoy buffer limit), and the evidence to capture is an over-limit POST
  # refused at the edge before it reaches a pod. Until that is done the controls here are the whole of it, and they
  # bound this process rather than the link to it.

spring:
  application:
    name: cash-account-modernized

  datasource:
    # Credentials only. The JDBC URL is assembled by config/DataSourceGuardConfig out of the cashaccount.jdbc.*
    # values below, because JDBC_SSL=true has to append ssl=true&sslmode=verify-ca plus EITHER sslrootcert=<temp
    # PEM> or sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory — a branch no static placeholder can express.
    # Keys database.id / database.password of the chart secret (.../templates/cash-account.yaml:L110-L119).
    #
    # There is deliberately no url key, and one arriving from any other property source - SPRING_DATASOURCE_URL in
    # the container environment, a system property, a command-line argument - is not honoured as a connection: that
    # single value would otherwise decide the dialect, the host, the credentials and the TLS mode together.
    # DataSourceGuardConfig refuses it while JDBC_HOST or JDBC_DB carries a value, which is every chart deployment,
    # and refuses it outright while JDBC_SSL asks for TLS, because sslmode=verify-ca verifies the certificate chain
    # and not the hostname; otherwise it keeps only the URL's host, port and database. So no property source can drop
    # sslmode=verify-ca, swap in a non-validating SSL factory, fold credentials into the URL or repoint the ledger.
    username: ${JDBC_ID:}
    password: ${JDBC_PASSWORD:}
    # Deliberately no spring.datasource.hikari.schema: the Operational Runbook's Step 1 rehearsal supplies
    # spring.datasource.hikari.schema=cash_account_rehearsal at run time so production tables stay untouched, which
    # a value pinned here would defeat.

  sql:
    init:
      mode: always
      schema-locations: classpath:schema/cash-account-schema.sql
      # Flyway and Liquibase occur in no pom.xml of this checkout and backend/portfolio hand-applies its
      # createTables.ddl, so the schema is applied by the mandated framework's own SQL initialization rather than by
      # introducing a migration tool the estate does not use. Two semicolons because Spring's script runner splits
      # on a single one, which would sever the ledger_entry_reject() function body and the trigger DO block of
      # schema/cash-account-schema.sql; every statement in that file therefore ends with ';;'. The separator here
      # and the terminators there are one contract — changing either alone breaks start-up.
      separator: ';;'

  jpa:
    hibernate:
      # Drift between the entities and schema/cash-account-schema.sql must stop start-up rather than be silently
      # auto-corrected against a ledger. spring.jpa.defer-datasource-initialization is left at its false default on
      # purpose: deferring would run this validation before the schema script and fail every cold start.
      ddl-auto: validate
    open-in-view: false
    properties:
      # Ledger and reservation timestamps are TIMESTAMPTZ, so pinning the JDBC zone keeps a written instant equal to
      # the instant read back whatever local zone the pod happens to carry.
      hibernate.jdbc.time_zone: UTC
      # Hibernate's default is one round trip per row, so a migration load that stages a whole DB2 unload and a
      # whole VSAM history into legacy_rate_table and legacy_history pays N round trips for N rows. The value bounds
      # how many statements share a round trip and decides nothing about correctness — a smaller number is slower and
      # a larger one holds more unsent statements, and neither changes what lands. 50 is the estate-neutral default,
      # and migration/load/LegacyLoader plus migration/reconcile/ReconciliationService use the same number for
      # cashaccount.migration.batch-chunk-size below, so a flush maps onto whole JDBC batches instead of
      # straddling them. The request path is unaffected in substance: a retail write flushes a single row, which is a batch of
      # one, and ledger_entry's BIGINT GENERATED ALWAYS AS IDENTITY key makes Hibernate issue its inserts singly in
      # any case because it needs the generated entry_id immediately.
      hibernate.jdbc.batch_size: 50
      # Ordering is what makes a batch a batch: within one flush Hibernate groups the statements of an entity type
      # together, so a staging pass produces batched INSERTs rather than an alternating sequence that breaks the
      # batch on every type change. It reorders statements inside a flush only, never across one, and the one
      # foreign key in the schema (migration_reconciliation.run_id → migration_run) is satisfied by an explicit
      # flush of the run row before the first finding is written, not by this ordering.
      hibernate.order_inserts: true
      hibernate.order_updates: true

  jackson:
    # No float or double may touch a money path, and a balance must reach the wire as plain decimal text: broker's
    # client consumes it and RetailContractIT captures the raw response to assert the literal "balance":1234.56,
    # which exponent notation would fail. config/JacksonConfig applies the same two settings programmatically; they
    # are declared here so this file remains the whole, self-describing configuration.
    deserialization:
      use-big-decimal-for-floats: true
    generator:
      write-bigdecimal-as-plain: true
    # The error payload carries owner and reservationId only where the condition has them, so absent fields are
    # omitted rather than rendered null.
    default-property-inclusion: non_null

  servlet:
    multipart:
      # No endpoint of this service consumes multipart/form-data - every write takes a JSON body - so the
      # capability is removed rather than left enabled and unused. Boot's MultipartAutoConfiguration is
      # @ConditionalOnProperty(prefix = "spring.servlet.multipart", name = "enabled", matchIfMissing = true),
      # so false removes the whole auto-configuration: no MultipartConfigElement on the dispatcher-servlet
      # registration and no StandardServletMultipartResolver. With Tomcat's allowCasualMultipartParsing at its
      # false default, neither the container nor Spring MVC then parses a multipart body, which puts the
      # temp-file path of CVE-2025-61795 out of reach whatever the container patch level. Defence in depth
      # beside the tomcat.version 10.1.60 bump in pom.xml, never a substitute for it.
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # startup is not optional: the chart's startupProbe hits /actuator/startup with a 60s initial delay, a 30s
        # period and 3 allowed failures (.../templates/cash-account.yaml:L204-L210) and global.healthCheck is true
        # by default (.../values.yaml:L54), so a pod missing this endpoint fails its very first deployment. The
        # endpoint exists only because CashAccountApplication installs a BufferingApplicationStartup(2048).
        # prometheus backs the scrape annotation below. Nothing broader is exposed — no '*'.
        include: health,startup,prometheus
  endpoint:
    health:
      # The readiness and liveness groups are only auto-enabled inside a detected Kubernetes environment; the probes
      # must also answer under `java -jar` and under @SpringBootTest, so enablement is explicit.
      probes:
        enabled: true
      # config/SecurityConfig leaves the probe paths permitAll, so the response must not describe internals.
      show-details: never
      group:
        readiness:
          # db belongs in readiness: a pod that cannot reach its ledger must leave the Service endpoints. The
          # exchange-rate API deliberately gets no health indicator, so an FX outage never flaps pods.
          include: readinessState,db
        liveness:
          # livenessState alone. A failing livenessProbe restarts the container
          # (.../templates/cash-account.yaml:L217-L222), so including db here would turn one database outage into a
          # rolling crash loop across every pod.
          include: livenessState
  prometheus:
    metrics:
      export:
        # Spring Boot 3.x property name (management.metrics.export.prometheus.* is the pre-3.0 form and is inert
        # here). The chart's scrape annotation carries prometheus.io/port "8080" with no path
        # (.../templates/cash-account.yaml:L51-L54), which is why config/MetricsScrapeController serves GET /metrics
        # from this registry in addition to the canonical /actuator/prometheus.
        enabled: true
  # No management.server.port: the chart probes and scrapes port 8080 only, so the management endpoints must stay on
  # the main connector.

cashaccount:
  migration:
    # Rows per flush-and-clear during a bulk load or reconcile. Unbounded, one load would hold every entity it has
    # written until the transaction ends - an out-of-memory failure halfway through a migration window. It is a
    # trade-off, not a correctness parameter: the same rows land whatever it is, because the whole load stays one
    # transaction (AAP 0.6.3). 50 matches spring.jpa.properties.hibernate.jdbc.batch_size above so a flush is whole
    # JDBC batches, and the key lives here rather than under tool.* because MigrationToolRunner rejects any tool.*
    # option outside the seven it declares; --cashaccount.migration.batch-chunk-size=<rows> overrides it.
    batch-chunk-size: 50

  jdbc:
    # Guarded rather than defaulted for convenience. database.kind is chart-global and is still db2 in the
    # repository (.../values.yaml:L74-L81), so config/DataSourceGuardConfig fails start-up with an explicit message
    # for any value other than postgres instead of half-starting against a store this schema was never written for.
    # Moving the release to PostgreSQL is a signed-off runbook Step 0 prerequisite, not a change this file makes.
    kind: ${JDBC_KIND:postgres}
    # Host and database carry no fallback. The chart injects both from non-optional configMap keys
    # (.../templates/cash-account.yaml:L89-L103), so a convenience default cannot help a real deployment and would
    # instead let a process started without that configMap reach a local database while its probes stayed green -
    # the ledger writing somewhere nobody is reconciling. The empty default resolves to a blank value on purpose:
    # it routes straight into config/DataSourceGuardConfig, which refuses to start and names the missing variable,
    # whereas a bare ${JDBC_HOST} would fail placeholder resolution with a message that names no remedy. Only the
    # port keeps its 5432, which is PostgreSQL's own listening port rather than a guess about this estate.
    host: ${JDBC_HOST:}
    port: ${JDBC_PORT:5432}
    database: ${JDBC_DB:}
    # Mirrors portfolio's <variable name="JDBC_SSL" defaultValue="false"/>
    # (backend/portfolio/src/main/liberty/config/includes/postgres.xml:L2).
    ssl: ${JDBC_SSL:false}
    # PEM text of the database server's CA, injected as cert_defaultTrustStore from configMap key ssl.certs and only
    # when global.specifyCerts is on (.../templates/cash-account.yaml:L179-L186), which defaults to false
    # (.../values.yaml:L72) — hence the empty default. When present, DataSourceGuardConfig writes it to a private
    # temp file and appends sslrootcert=<file> so pgJDBC's LibPQFactory verifies the server chain against it; when
    # absent it appends sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory so trust rides on the JVM cacerts. Both
    # are the properties portfolio already uses, with sslMode=verify-ca
    # (backend/portfolio/src/main/liberty/config/includes/postgres.xml:L9-L11).
    trust-store-pem: ${cert_defaultTrustStore:}

  fx:
    # Never a hardcoded endpoint: the chart supplies it as CURRENCY_API_URL from cashAccount.exchangeRateUrl
    # (.../templates/cash-account.yaml:L156-L160), whose value is the default written here (.../values.yaml:L147).
    # That endpoint answers 301 to another host, so config/FxClientConfig builds its client on an HttpClient that
    # follows redirects. This live lookup replaces the legacy STOCKTRD.FRANKFURT1 rate-table join, a
    # migration-source artifact and not a target-state dependency (backend/cash-account-cobol/COBOL/CASH00.cbl:L213-L219).
    url: ${CURRENCY_API_URL:https://api.frankfurter.app/latest}
    # Broker's default account currency, so a same-currency account short-circuits to a rate of exactly 1 with no
    # network call (backend/broker/src/main/java/com/ibm/hybrid/cloud/sample/stocktrader/broker/BrokerService.java:L357-L365).
    base-currency: USD
    # Connect and read budget for FrankfurterExchangeRateClient. A slow rate provider must surface as
    # 503 EXCHANGE_RATE_UNAVAILABLE with the balance untouched, never as a request that outlives its caller.
    timeout: PT2S
    # THE single authority for the accepted-currency policy: retail/RetailCashAccountService,
    # migration/reconcile/ReconciliationService and fx/FrankfurterExchangeRateClient all bind this key, so
    # narrowing it here - or through CASHACCOUNT_FX_ACCEPTED_CURRENCIES with no chart change - narrows all three.
    # It is the ESTATE allowlist, adopted verbatim from the allowed_currencies CHECK the estate already enforces
    # (infra/stocktrader-setup/azure/modules/postgres_init/init_schema.sql.tmpl:L7), NOT the set the exchange-rate
    # provider serves: that provider omits BGN, so acceptance is no promise of convertibility. BGN stays because
    # this list also decides what a legacy export may be LOADED with, and dropping it would strand a
    # BGN-denominated legacy account; keeping it costs at most a 503 EXCHANGE_RATE_UNAVAILABLE on a cross-currency
    # credit or debit, balance unchanged and no ledger row.
    accepted-currencies: [
      AUD, BGN, BRL, CAD, CHF, CNY, CZK, DKK, EUR, GBP, HKD, HUF, IDR, ILS, INR, ISK,
      JPY, KRW, MXN, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD, ZAR
    ]

  security:
    # From global.auth (.../templates/cash-account.yaml:L73-L77); the default matches both the chart
    # (.../values.yaml:L20) and broker's own variable default
    # (backend/broker/src/main/liberty/config/server.xml:L40), so this service selects the same mode the estate
    # already runs in rather than introducing a mechanism of its own.
    auth-type: ${AUTH_TYPE:basic}
    # Grants StockTrader to every authenticated principal, mirroring the siblings' ALL_AUTHENTICATED_USERS ->
    # StockTrader binding (backend/broker/src/main/liberty/config/server.xml:L56-L60). Deployed default is true so
    # any authenticated caller can write exactly as it can through broker today and the GET/write role split stays
    # latent; false is the supported, documented strict mode in which only the token's groups claim decides.
    all-authenticated-hold-stocktrader: true
    jwt:
      # Same issuer and audience the estate's tokens already carry (.../templates/cash-account.yaml:L161-L170,
      # .../values.yaml:L207-L209, backend/broker/src/main/liberty/config/server.xml:L41-L42), so broker's
      # propagated Authorization header validates here without a new identity mechanism.
      issuer: ${JWT_ISSUER:http://stock-trader.ibm.com}
      audience: ${JWT_AUDIENCE:stock-trader}
      # Public certificate of the shared jwtSigner alias only — the private key that siblings ship inside trust.p12
      # is copied nowhere in this module (backend/broker/src/main/liberty/config/includes/basic.xml:L39-L40). It
      # stays a property rather than a path baked into code so tests can repoint it at an ephemeral per-JVM key.
      public-key-location: classpath:security/jwtsigner.pem
      # Consumed only when auth-type=oidc, mirroring the mpJwt jwksUri attribute broker resolves from the same
      # variable (backend/broker/src/main/liberty/config/includes/oidc.xml:L16-L21). The chart marks the key optional
      # (.../templates/cash-account.yaml:L171-L176), so the default is empty.
      jwks-url: ${OIDC_JWKS_URL:}

  reservation:
    # A hold that is never settled or released must not strand funds indefinitely; the sweep interval bounds how
    # long an overdue hold keeps money out of the available balance.
    default-ttl: PT24H
    expiry-sweep-interval: PT60S

logging:
  level:
    com.ibm.hybrid.cloud.sample.stocktrader.cashaccount: INFO
