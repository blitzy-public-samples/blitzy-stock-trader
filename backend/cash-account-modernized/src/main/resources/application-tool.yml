# Profile "tool": the same jar run as an offline migration/reconciliation CLI, overlaying application.yml.

spring:
  main:
    # A load or a reconcile is an operator-run batch invocation against an export directory, so the
    # process must not acquire a routable endpoint while it runs. Starting a listener beside it would
    # expose the new service to callers during a rehearsal, which is exactly the prohibition the
    # Operational Runbook is built around: no traffic reaches this service until the cutover step
    # signs off. With no web application type there is no connector, no controller and no security
    # filter chain to enter, so that property is structural rather than a matter of configuration
    # discipline. It also keeps the tool's lifetime equal to its work: the runner returns an exit code
    # (0 clean, 2 variance, 1 error) and the JVM ends, instead of a web context holding the process
    # open after the last row is written.
    web-application-type: none

    # Quoted deliberately: YAML 1.1 reads bare `off` as the boolean false, which does not convert to
    # Banner.Mode and would fail start-up.
    #
    # Banner and start-up inventory are decoration in an interactive shell and noise in a captured
    # transcript. What an operator reads out of a tool run is the exit code and the migration_run /
    # migration_reconciliation rows it wrote, both of which the runbook captures as step evidence;
    # anything printed before the first record is read competes with that evidence for attention.
    # Application log levels are left to application.yml so one file remains the authority on them.
    banner-mode: "off"
    log-startup-info: false

  # Four base-profile settings are deliberately NOT restated here, because the tool has to inherit them
  # rather than hold an opinion about them:
  #
  #   spring.sql.init.*      The rehearsal schema is created by the very same schema/cash-account-schema.sql
  #                          the service applies. The runbook's Step 1 reset is DROP SCHEMA ... CASCADE,
  #                          CREATE SCHEMA, then re-run the tool so the script re-applies — a reset that
  #                          only works while initialization stays enabled in this profile.
  #   hikari.schema          Left unpinned so the runbook can pass
  #                          --spring.datasource.hikari.schema=cash_account_rehearsal per invocation.
  #                          Pinning any schema here would either defeat that isolation or silently
  #                          redirect a production-schema run.
  #   jpa.hibernate.ddl-auto Stays `validate`. The tool writes ledger_entry, cash_account and the staging
  #                          tables directly, so it must be held to the identical schema contract the
  #                          service validates against; a relaxed setting here could let a tool run
  #                          create structure the service would then reject at start-up.
  #   datasource.*           Credentials and the guarded, assembled URL come from the same place in both
  #                          profiles, so a rehearsal cannot reach a store the service could not.

tool:
  # Intentionally empty. A bare `--spring.profiles.active=tool` would otherwise perform whichever
  # command was defaulted here against whichever directory happened to be configured — a load is a
  # write, and the one place it must never land by accident is a schema an operator did not name.
  # The runner rejects a missing or unrecognized value; legal values are `load`, `reconcile` and
  # `shadow-compare`.
  command:

  # Intentionally empty, and never a path inside this repository. The tooling is verified against the
  # synthetic fixtures under src/test/resources/fixtures/ alone; a default pointing anywhere real would
  # turn "the operator forgot an argument" into "the tool chose a source", and the source it must never
  # choose is the live DB2 for z/OS or VSAM export.
  input:

  # Intentionally empty. Every invocation records its own migration_run.run_id, so the batch id is the
  # only thing that ties a `reconcile` to the `load` it judges, and a retry after a FAILED load is a new
  # run_id under the same batch id. A value generated when the operator omits it would produce a run
  # that reconciles nothing and looks clean doing it.
  batch-id:

  # legacy-table, because parity can only be judged on identical inputs. The legacy balance came from
  # the two-decimal RATES column of the staged rate table
  # (backend/cash-account-cobol/COBOL/CASH00.cbl:L213-L222; COBOL/DCLFRANK.cpy:L12), so expected values
  # are computed from those same rows and any difference that remains is a genuine target difference.
  # Judging against a live rate instead would report every intervening ECB fixing as a balance variance.
  # With `live`, a difference the rate difference fully explains is reclassified RATE_SOURCE /
  # ACCEPTED_EXCEPTION and anything left over stays BALANCE / VARIANCE. ToolExchangeRateSource selects
  # its delegate from this value; ReconciliationService and ShadowComparator carry the same default, so
  # the two can never disagree about which rate produced an expected balance.
  rate-source: legacy-table

  # A property rather than a constant because the repository cannot settle it. The database, the
  # tablespace and both tables are created CCSID EBCDIC
  # (backend/cash-account-cobol/DB2-DDL/DB2DDL.jcl:L22, L29, L51, L61), which names an encoding family
  # and not a code page, and the CICS region's exact CCSID appears nowhere in this module — an open item
  # the mainframe team answers (docs/legacy-characterization.md section 9.6). IBM037 is therefore a
  # documented assumption, and a wrong assumption corrupts every decoded owner name, so it has to be
  # correctable by configuration in the middle of a migration window rather than by a rebuild.
  legacy-charset: IBM037

  # Same reasoning, same open item. The history stamps are region local time — EXEC CICS FORMATTIME
  # fills YYYYMMDD and HHMMSS from ASKTIME
  # (backend/cash-account-cobol/COBOL/CASH00.cbl:L80-L85), written into the record at L40-L41 — and no
  # artifact here names the region's zone. A wrong zone silently shifts every legacy_history.event_at by
  # a fixed offset, which would make the shadow step's window boundaries meaningless while every
  # individual row still looked plausible.
  legacy-timezone: UTC

  # NOT A tool.* KEY, AND DELIBERATELY SO. The chunk size a bulk load and a bulk reconcile flush by lives
  # at cashaccount.migration.batch-chunk-size in application.yml, beside the JDBC batch size it has to
  # match. MigrationToolRunner rejects any tool.* command-line option outside the seven it declares, so a
  # tuning knob added to this namespace could never be passed on the command line — the one place an
  # operator sizing a migration window would reach for it. Override it per invocation with
  # --cashaccount.migration.batch-chunk-size=<rows>, which the runner's typo guard leaves alone.

  # Intentionally empty: the one value in this file whose absence of a default IS the requirement.
  # CASH00 writes 57 bytes — the accumulated width of WS-VSAM-RECORD
  # (backend/cash-account-cobol/COBOL/CASH00.cbl:L38-L45), passed as LENGTH OF WS-VSAM-RECORD at L128 —
  # into a cluster defined RECSZ(100 100) (backend/cash-account-cobol/VSAM/DEFKSDS.jcl:L11). Which of
  # the two a real REPRO yields depends on the CICS FILE definition, which is not in this repository and
  # is obtained during the runbook's migration-rehearsal step (docs/legacy-characterization.md section
  # 9.5). The length is consequently declared and never inferred: mandatory whenever binary history is
  # the input, 57 or 100, with the file length required to be an exact multiple of it and anything else
  # rejected explicitly. A guessed length divides a file cleanly often enough to look correct and then
  # shifts every field of every record by a few bytes — the one failure this key exists to prevent.
  history-record-length:
