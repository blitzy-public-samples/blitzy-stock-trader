# Profile "test": a thin overlay of application.yml, which stays the source of truth for every key not below.
# Only settings whose deployed value would make a test non-deterministic or offline-unsafe are restated here;
# copying anything else would create a second source of truth that silently diverges from the base.

cashaccount:
  jdbc:
    # application.yml resolves this as ${JDBC_KIND:postgres}, so an ambient JDBC_KIND would reach
    # DataSourceGuardConfig's @PostConstruct guard and fail every context; this literal outranks it.
    # Testcontainers' @ServiceConnection supplies the connection details, so no URL is assembled here.
    kind: postgres
  fx:
    # Offline by construction: the inherited default is the live endpoint behind a redirect-following client,
    # while the *IT accounts are USD, where a same-currency rate of exactly 1 short-circuits before any call.
    # Port 1 refuses instantly, so an unintended cross-currency path fails fast rather than egressing.
    url: http://127.0.0.1:1/latest
  security:
    # The mode the estate already runs in (values.yaml:L20, broker's server.xml:L40), so tests exercise the
    # deployed RS256 resource-server chain rather than a mechanism invented for them.
    auth-type: basic
    jwt:
      # The chart's deployed literals (values.yaml:L207-L209, broker's server.xml:L41-L42), so no second set
      # of magic strings enters the module. HARD CONTRACT for support/JwtTestTokens, written after this file
      # and reading it: its tokens must carry exactly these as iss and aud, or every *IT is answered 401.
      issuer: http://stock-trader.ibm.com
      audience: stock-trader
  reservation:
    # The deployed PT60S sweep would fire mid-assertion and race ReservationLifecycleIT's expiry and
    # sweep-versus-settle cases; tests drive the sweep directly, so it is moved aside, not disabled.
    expiry-sweep-interval: PT1H

management:
  endpoint:
    health:
      # Inherited, restated once so ActuatorProbesIT's precondition is local: these groups self-enable only
      # inside a detected Kubernetes environment, never under @SpringBootTest.
      probes:
        enabled: true

# Absent on purpose, and no later edit may undo any of it:
#   security.jwt.public-key-location - support/JwtTestTokens injects an ephemeral per-JVM key's PEM with
#     @DynamicPropertySource; a pinned location defeats that, and no key material belongs in this tree.
#   security.all-authenticated-hold-stocktrader - stays the deployed true, broker's ALL_AUTHENTICATED_USERS
#     -> StockTrader parity grant (server.xml:L56-L60); RoleEnforcementIT selects both modes per context.
#   spring.datasource.url / username / password - from the postgres:12.22-alpine @ServiceConnection container.
#   spring.sql.init.* (separator ';;'), jpa.hibernate.ddl-auto, jpa.open-in-view, server.port, the actuator
#     exposure list, the health groups and the Jackson BigDecimal features - inherited; LedgerImmutabilityIT
#     needs the inherited sql.init to re-apply the schema across a context restart.
#   tool.* - owned by application-tool.yml.
