org.eclipse.microprofile.rest.client.propagateHeaders=Authorization,Proxy-Authorization
otel.sdk.disabled=false
otel.exporter.otlp.endpoint=http://jaeger-collector.istio-system.svc.cluster.local:4317
# Narrower than the OpenTelemetry default tracecontext,baggage, and deliberately so: the W3C
# baggage propagator below OpenTelemetry 1.62.0 allocates without bound while parsing an inbound
# baggage header (CVE-2026-45292 / GHSA-rcgg-9c38-7xpx), and no Open Liberty release ships a fixed
# SDK - 26.0.0.9, the newest, carries 1.48.0. Naming only tracecontext leaves that propagator
# uninstalled, so the header is never parsed on any request path, authenticated or not, while trace
# context still propagates and every @WithSpan span is still recorded. Restore the default only
# once the runtime ships OpenTelemetry 1.62.0 or later.
otel.propagators=tracecontext
MAX_ORDER_NOTIONAL=1000000.00
MAX_POSITION_NOTIONAL=5000000.00
FAT_FINGER_NOTIONAL_THRESHOLD=2500000.00
RESTRICTED_SYMBOLS=RSTRA,RSTRB
EXCEPTION_SLA_HOURS=24
ORDER_CAPACITY=10000
SETTLEMENT_EXCEPTION_CAPACITY=10000
POSITION_CAPACITY=5000
AUDIT_EVENT_CAPACITY=150000
